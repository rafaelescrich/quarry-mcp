[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quarry-mcp"
version = "0.1.0"
description = "MCP server for Lean 4 proof corpus queries"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
quarry-mcp = "quarry_mcp.cli:main"

[tool.setuptools.package-data]
quarry_mcp = ["static/*.html", "static/*.css", "static/*.js"]
